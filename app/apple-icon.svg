<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00873a" />
      <stop offset="100%" stop-color="#005021" />
    </linearGradient>
    <linearGradient id="appleLeaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>
    <linearGradient id="appleLeaf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    <filter id="appleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- iOS / Apple Touch Squircle Base -->
  <rect width="180" height="180" rx="42" fill="url(#appleBg)" />
  <rect x="4" y="4" width="172" height="172" rx="38" fill="none" stroke="#84cc16" stroke-width="2" stroke-opacity="0.35" />

  <!-- NiceFood Twin Fresh Leaves Emblem -->
  <g transform="translate(42, 22) scale(1.5)">
    <!-- Back Leaf -->
    <path d="M26 4 C10 12 5 28 8 46 C16 48 35 45 43 32 C47 18 37 7 26 4 Z" fill="url(#appleLeaf2)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M11 40 Q 22 28 29 13" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Front Leaf -->
    <path d="M41 11 C26 15 20 33 25 51 C35 53 53 47 59 34 C63 22 51 13 41 11 Z" fill="url(#appleLeaf1)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M28 45 Q 37 32 45 19" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>

  <!-- NiceFood Typography Monogram -->
  <text x="90" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">NF</text>
  <circle cx="90" cy="162" r="3" fill="#a3e635" />
</svg>
